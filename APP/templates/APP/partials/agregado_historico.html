{% if historico %}
<div class="table-responsive">
    <table class="table table-striped table-sm" style="font-size: 12px;">
        <thead>
            <tr>
                <th class="text-nowrap" style="width: 15%;">Data/Hora</th>
                <th class="text-nowrap" style="width: 15%;">Usuário</th>
                <th>Alteração Realizada</th>
            </tr>
        </thead>
        <tbody>
            {% for log in historico %}
            <tr>
                <td class="text-nowrap">{{ log.timestamp|date:"d/m/Y H:i" }}</td>
                <td class="text-nowrap">{{ log.usuario.username|default:"Sistema" }}</td>
                <td>{{ log.acao }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<p class="text-muted" style="font-size: 12px;">Nenhum histórico registrado para este veículo.</p>
{% endif %}
<div class="modal-footer mt-3 p-0 pt-3 border-top-0">
    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Fechar</button>
</div>
